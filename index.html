<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スマホの中の4日間</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(circle at 30% 20%,#2a3550,#0f1420 70%);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;color:#1f2430;display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.phone{position:relative;width:min(400px,100vw);height:min(790px,100vh);background:#111;border-radius:44px;padding:11px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 2px #333}
.screen{position:relative;width:100%;height:100%;background:#f4f5f7;border-radius:34px;overflow:hidden;display:flex;flex-direction:column}
@media(max-width:440px),(max-height:620px){.phone{border-radius:0;padding:0;width:100vw;height:100vh}.screen{border-radius:0}}
.status{position:absolute;top:0;left:0;right:0;height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px;font-weight:700;z-index:5;color:#fff;pointer-events:none}
.view{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.shake{animation:shake .5s 2}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.btn{display:block;border:none;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:700;background:#e5e7eb;color:#1f2430;width:100%;text-align:center}
.btn.primary{background:#2f6fed;color:#fff}
.btn.danger{background:#e03131;color:#fff}
.btn.ghost{background:transparent;border:2px solid #cbd2dc}
.btn.safe{background:#fff;border:2px solid #2b8a3e;color:#2b8a3e}
.btn:disabled{opacity:.4}
.btn+.btn{margin-top:10px}
/* guide */
.guide{flex:none;display:none;background:#fff8db;border-top:3px solid #f59e0b;padding:8px 14px 12px;font-size:14px;line-height:1.55;font-weight:700;color:#4a3200;z-index:6}
.guide.on{display:block}
.guide small{display:block;font-size:11px;color:#b45309;letter-spacing:.08em;margin-bottom:1px}
/* title / intro */
.title{flex:1;background:linear-gradient(160deg,#1e3a8a,#7c3aed);color:#fff;padding:70px 28px 22px;display:flex;flex-direction:column;align-items:center;text-align:center}
.t-badge{font-size:12px;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:99px;letter-spacing:.1em}
.title h1{font-size:38px;line-height:1.25;margin:22px 0 16px;letter-spacing:.04em}
.title p{font-size:14px;line-height:1.9;opacity:.92}
.title .btn{max-width:260px;background:#fff;color:#1e3a8a;font-size:17px;margin-top:26px}
.snd{margin-top:16px;font-size:13px;opacity:.9;display:flex;gap:6px;align-items:center}
.chap{margin-top:14px;font-size:12px;background:none;border:none;color:#fff;opacity:.75;text-decoration:underline}
.chaplist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;width:100%;max-width:280px}
.chaplist button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:8px;font-size:13px;font-weight:700}
.credit{margin-top:auto;padding-top:14px;font-size:11px;opacity:.7}
.intro{flex:1;background:#fff;padding:50px 22px 18px;display:flex;flex-direction:column;overflow-y:auto}
.intro .step{font-size:12px;font-weight:800;color:#7c3aed;letter-spacing:.1em}
.intro h2{font-size:24px;margin:6px 0 14px;line-height:1.4}
.intro p{font-size:15px;line-height:1.85;margin-bottom:12px}
.ibox{background:#f5f3ff;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.7}
.ibox b{color:#5b21b6}
.irow{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:14px;line-height:1.65}
.irow .ii{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#eef2ff}
.dots{display:flex;gap:6px;justify-content:center;margin:auto 0 12px;padding-top:14px}
.dots i{width:8px;height:8px;border-radius:50%;background:#d1d5db}.dots i.on{background:#7c3aed;width:22px;border-radius:4px}
.ds{flex:1;background:linear-gradient(170deg,#0f172a,#1e293b);color:#fff;padding:64px 26px 22px;display:flex;flex-direction:column}
.ds .dn{font-size:15px;font-weight:800;color:#fbbf24;letter-spacing:.15em}
.ds h2{font-size:30px;margin:8px 0 4px}
.ds .when{font-size:14px;opacity:.75;margin-bottom:22px}
.ds p{font-size:15px;line-height:1.9;margin-bottom:18px}
.ds .mis{background:#fff;color:#1f2430;border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.6;font-weight:700}
.ds .mis small{display:block;color:#7c3aed;font-size:12px;margin-bottom:3px}
.ds .theme{display:inline-block;margin-top:14px;font-size:12px;background:rgba(251,191,36,.18);color:#fde68a;padding:4px 10px;border-radius:99px}
.ds .btn{margin-top:auto;background:#fbbf24;color:#1f2430;font-size:17px}
/* home */
.home{flex:1;background:linear-gradient(170deg,#0ea5e9,#6366f1 60%,#a855f7);color:#fff;padding:60px 20px 20px;display:flex;flex-direction:column}
.clock{font-size:64px;font-weight:300;text-align:center;letter-spacing:.02em}
.date{text-align:center;font-size:14px;opacity:.9;margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px}
.app{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;position:relative}
.app .ic{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.app.hint .ic{animation:pulse 1.2s infinite;outline:3px solid #fde047;outline-offset:2px}
.app.hint::after{content:'👆';position:absolute;bottom:4px;right:-2px;font-size:22px;animation:bob .8s infinite alternate}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(253,224,71,.9)}100%{box-shadow:0 0 0 16px rgba(253,224,71,0)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.badge{position:absolute;top:-6px;right:6px;background:#ef4444;color:#fff;font-size:12px;font-weight:800;border-radius:99px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.daychip{margin-top:auto;align-self:center;font-size:12px;background:rgba(0,0,0,.2);padding:6px 14px;border-radius:99px}
/* app header */
.ah{flex:none;display:flex;align-items:center;gap:8px;padding:42px 12px 10px;color:#fff;font-weight:800;font-size:16px}
.ah button{background:none;border:none;color:#fff;font-size:28px;line-height:1;width:32px}
.body{flex:1;overflow-y:auto;padding:14px;position:relative}
/* chat */
.msg{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;background:#dbeafe}
.who{font-size:11px;color:#6b7280;margin-bottom:3px}
.bub{background:#fff;border-radius:4px 16px 16px 16px;padding:10px 13px;font-size:14px;line-height:1.7;max-width:270px;box-shadow:0 1px 2px rgba(0,0,0,.08);white-space:pre-wrap;word-break:break-word}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:#2f6fed;color:#fff;border-radius:16px 4px 16px 16px}
.sys{text-align:center;font-size:12px;color:#6b7280;background:#e5e7eb;border-radius:99px;padding:5px 12px;margin:0 auto 14px;width:fit-content;max-width:95%}
.sys.red{background:#fee2e2;color:#b91c1c;font-weight:800}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#a78bfa;margin:0 2px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
.chips{flex:none;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;background:#fff;border-top:1px solid #e5e7eb}
.chip{border:1.5px solid #7c3aed;color:#7c3aed;background:#faf5ff;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:700}
.chip:disabled{opacity:.4}
.form{width:100%;font-size:13px}
.form .fl{font-weight:800;margin-bottom:4px}
.form label{display:flex;gap:8px;align-items:center;padding:5px 2px;font-size:14px}
.form input{width:18px;height:18px;flex:none}
.form .btn{margin-top:8px;padding:10px}
.fine{flex:none;background:#fff;font-size:10px;color:#9ca3af;padding:0 14px 4px}
.inputbar{flex:none;background:#fff;padding:0 12px 12px;display:flex}
.inputbar div{flex:1;border:1px solid #d1d5db;border-radius:99px;padding:9px 14px;font-size:13px;color:#9ca3af}
.link{color:#2f6fed;text-decoration:underline;cursor:pointer;word-break:break-all}
.msg.me .link{color:#fff}
.choice{flex:none;background:#fff;border-top:1px solid #e5e7eb;padding:10px 12px}
.choice .q{font-size:13px;font-weight:800;margin-bottom:8px;color:#374151}
/* browser */
.urlbar{flex:none;background:#fff;margin:0 10px 8px;border-radius:12px;padding:8px 8px 8px 12px;font-size:13px;color:#374151;display:flex;gap:6px;align-items:center}
.urlbar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.urlbar button{flex:none;background:#eef2f7;border:none;border-radius:8px;font-size:12px;font-weight:800;padding:5px 8px;color:#374151}
.res{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.res .u{font-size:11px;color:#15803d;margin-bottom:3px}
.res .t{color:#1a0dab;font-size:15px;font-weight:700;line-height:1.4;margin-bottom:5px}
.res .s{font-size:13px;color:#4b5563;line-height:1.6}
.offi{display:inline-block;background:#e0f2fe;color:#0369a1;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:4px}
.page{background:#fff;min-height:100%;font-size:14px;line-height:1.8}
.blog-h{background:linear-gradient(90deg,#f43f5e,#f59e0b);color:#fff;padding:14px;font-weight:900;font-size:18px}
.ad{margin:12px;background:#fef08a;border:2px dashed #ca8a04;padding:10px;text-align:center;font-weight:800;font-size:13px;color:#854d0e}
.page h2{font-size:18px;padding:0 14px;margin:14px 0 8px;line-height:1.5}
.page p{padding:0 14px;margin-bottom:10px}
.tiny{font-size:10px;color:#9ca3af;padding:20px 14px}
.muse-h{background:#0f3d3e;color:#fff;padding:14px;font-weight:700}
.muse-h small{display:block;font-size:11px;opacity:.7;font-weight:400}
.fact{margin:0 14px 12px;background:#f0fdf4;border-left:4px solid #15803d;padding:10px 12px;border-radius:6px}
.e404{padding:60px 20px;text-align:center;color:#6b7280}
.e404 b{display:block;font-size:56px;color:#d1d5db}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.7;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.zero{color:#b91c1c;font-weight:800;font-size:16px}
/* notebook */
.paper{background:#fffef7;background-image:repeating-linear-gradient(#fffef7 0 31px,#e0e7ff 31px 32px);border-radius:12px;padding:18px 16px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:14px}
.paper h3{font-size:16px;margin-bottom:14px}
.paper .q{font-size:14px;font-weight:800;margin:14px 0 6px}
select{width:100%;font-size:15px;padding:10px;border-radius:10px;border:1.5px solid #cbd2dc;background:#fff;font-family:inherit}
.cb{display:flex;gap:8px;align-items:center;font-size:14px;padding:5px 0}
.cb input{width:18px;height:18px}
.pasted{animation:flash 1s}
@keyframes flash{0%{background:#fde68a}100%{background:#fffef7}}
/* modal / overlay */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:40}
.modal .box{background:#fff;border-radius:18px;padding:20px;width:100%;font-size:14px;line-height:1.7}
.modal h4{font-size:17px;margin-bottom:8px}
.modal .box.stop{border:4px solid #e03131}
.modal .box.stop h4{color:#e03131;font-size:22px}
.night{position:absolute;inset:0;background:#000;color:#fff;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:22px;letter-spacing:.2em;opacity:0;transition:opacity .8s}
.night.on{opacity:1}
.night small{font-size:14px;margin-top:10px;opacity:.7;letter-spacing:.1em}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:99px;z-index:45;white-space:nowrap;animation:pop .25s}
/* notification */
.notif{position:absolute;top:8px;left:10px;right:10px;background:rgba(255,255,255,.97);border-radius:18px;padding:11px 13px;display:flex;gap:10px;z-index:35;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(-140%);transition:transform .35s;cursor:pointer;font-size:13px;line-height:1.5}
.notif.show{transform:none}
.notif .ni{font-size:24px}
.notif .na{font-size:11px;color:#6b7280}
.notif .nb{color:#374151;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* glitch */
.glitch .view{animation:gl .14s infinite}
@keyframes gl{0%{transform:translate(0);filter:none}25%{transform:translate(-5px,2px);filter:hue-rotate(90deg) saturate(4)}50%{transform:translate(4px,-3px);filter:invert(1)}75%{transform:translate(-2px,-1px);filter:hue-rotate(220deg) contrast(2)}100%{transform:translate(0)}}
.noise{position:absolute;inset:0;z-index:30;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,0,60,.25) 0 3px,transparent 3px 9px,rgba(0,255,200,.18) 9px 11px,transparent 11px 17px);animation:nz .1s infinite;mix-blend-mode:multiply}
@keyframes nz{0%{background-position:0 0}100%{background-position:0 40px}}
/* report (day1) */
.report{position:relative;background:#fff;border-radius:6px;padding:16px 14px;font-size:13px;line-height:1.7;box-shadow:0 2px 8px rgba(0,0,0,.15);margin:4px 0 14px 44px}
.report .rt{font-weight:800;margin-bottom:8px}
.report .row{border-bottom:1px solid #eee;padding:6px 0;padding-right:70px}
.pen{color:#e03131;font-weight:700;font-size:12px}
.mk{font-weight:900;margin-left:4px;color:#e03131}
.score{text-align:right;font-size:22px;font-weight:900;color:#e03131;margin-top:6px}
.stamp{position:absolute;top:10px;right:10px;border:3px solid;border-radius:50%;width:74px;height:74px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:13px;transform:rotate(-14deg);line-height:1.2;animation:stamp .4s ease-out;background:rgba(255,255,255,.8)}
.stamp.ng{color:#e03131;border-color:#e03131}.stamp.ok{color:#2b8a3e;border-color:#2b8a3e}
@keyframes stamp{from{transform:scale(2.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-14deg);opacity:1}}
/* reveal */
.rv h3{font-size:16px;margin:20px 0 8px;display:flex;gap:6px;align-items:center}
.rv h3:first-child{margin-top:0}
.log li{list-style:none;font-size:14px;padding:4px 0;line-height:1.5}
.ai-copy{background:#faf5ff;border:1px solid #e9d5ff;border-radius:12px;padding:12px;font-size:14px;line-height:1.9}
mark.ng{background:#fecaca;color:#991b1b;font-weight:800;padding:0 2px;border-radius:3px}
mark.ok{background:#bbf7d0;color:#14532d;padding:0 2px;border-radius:3px}
.fix{font-size:12px;color:#e03131;font-weight:800}
.hl{background:linear-gradient(135deg,#7c3aed,#2f6fed);color:#fff;border-radius:14px;padding:14px;font-size:14px;line-height:1.8}
.hl b{font-size:18px;display:block}
.tips li{list-style:none;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:14px;line-height:1.6;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tips li b{color:#2f6fed}
.point{background:#fef3c7;border:2px solid #f59e0b;border-radius:14px;padding:14px;text-align:center;font-weight:800;font-size:16px;line-height:1.6;margin-top:18px}
.point small{display:block;font-size:12px;color:#b45309}
.note-s{font-size:11px;color:#6b7280;margin-top:10px;line-height:1.6}
.verdict{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px}
.verdict.ok{background:#dcfce7;color:#166534}.verdict.mid{background:#fef3c7;color:#92400e}.verdict.ng{background:#fee2e2;color:#991b1b}
/* SNS */
.sns-h{background:linear-gradient(90deg,#ec4899,#f97316)}
.prof{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.prof .pa{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#fbcfe8,#fed7aa);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;border:3px solid #fff;box-shadow:0 0 0 2px #ec4899}
.prof b{font-size:16px}
.ptext{font-size:14px;line-height:1.7;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.radio{display:flex;gap:8px;align-items:flex-start;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.5;cursor:pointer}
.radio.on{border-color:#ec4899;background:#fdf2f8}
.radio input{margin-top:3px;width:16px;height:16px;flex:none}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.photos .pw{border:3px solid transparent;border-radius:12px;padding:0;background:none;overflow:hidden}
.photos .pw.on{border-color:#ec4899}
.photos .cap{font-size:11px;padding:4px 0;text-align:center;background:#fff;color:#374151}
.ph{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;container-type:inline-size}
.ph.big{border-radius:0}
.ph .e{position:absolute;line-height:1}
.ph .plate{position:absolute;background:#fff;border:1px solid #6b7280;color:#111;font-weight:800;line-height:1.2;text-align:center}
.toggle{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.sw{width:50px;height:30px;border-radius:99px;background:#d1d5db;position:relative;border:none;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:#22c55e}.sw.on::after{left:23px}
.post{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.post .ph-h{display:flex;gap:8px;align-items:center;padding:10px 12px;font-size:13px}
.post .ph-h .pa{width:30px;height:30px;font-size:16px;border-width:2px}
.post .geo{font-size:11px;color:#6b7280}
.post .pf{padding:10px 12px;font-size:13px;line-height:1.6}
.inbox{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;cursor:pointer;border:2px solid #ec4899;animation:pop .3s}
/* map */
.map{position:relative;height:210px;background:#e5ede0;border-radius:14px;overflow:hidden;margin-bottom:12px}
.road{position:absolute;background:#fff}
.river{position:absolute;background:#bfdbfe}
.pin{position:absolute;font-size:28px;transform:translate(-50%,-100%);animation:drop .5s both}
.pin span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;background:#fff;padding:1px 5px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-180%)}to{opacity:1;transform:translate(-50%,-100%)}}
.zone{position:absolute;border:3px dashed #e03131;border-radius:50%;background:rgba(224,49,49,.1);transform:translate(-50%,-50%);animation:shrink 3s 1.5s both}
@keyframes shrink{from{width:400px;height:400px;opacity:0}20%{opacity:1}to{width:60px;height:60px;opacity:1}}
.dossier li{list-style:none;background:#fff;border-left:4px solid #e03131;border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:14px;line-height:1.5;animation:pop .3s both}
.dossier small{display:block;color:#6b7280;font-size:11px}
/* fake sites */
.hay-h{background:#ea580c;color:#fff;padding:14px;font-weight:900;font-size:20px}
.gift{background:linear-gradient(180deg,#1e1b4b,#6d28d9);color:#fff;min-height:100%;padding:18px;text-align:center}
.gift h2{font-size:22px;line-height:1.4;margin:10px 0}
.gift .gem{font-size:60px}
.gift .cd{display:inline-block;background:#e11d48;padding:4px 12px;border-radius:8px;font-weight:900;margin:8px 0 14px}
.gift input{width:100%;padding:11px;border-radius:10px;border:none;margin-bottom:8px;font-size:15px;font-family:inherit}
.gift .btn{background:#facc15;color:#1f2430}
.warn{position:absolute;inset:0;background:#b91c1c;color:#fff;z-index:8;padding:22px 18px;text-align:center;animation:wflash .6s infinite alternate}
@keyframes wflash{from{background:#b91c1c}to{background:#dc2626}}
.warn h2{font-size:26px;margin:6px 0 10px}
.warn .big{font-size:56px}
.warn p{font-size:15px;line-height:1.7;margin-bottom:10px;font-weight:700}
.warn .cdn{font-size:30px;font-weight:900;background:#000;display:inline-block;padding:4px 14px;border-radius:8px;margin:6px 0 14px;font-family:monospace}
.warn .btn{background:#fff;color:#b91c1c;font-size:16px}
.warn .fx{position:absolute;top:8px;right:10px;background:none;border:none;color:#fca5a5;font-size:20px;width:30px;height:30px}
.pay-h{background:#0f172a;color:#fff;padding:14px;font-weight:800}
.fld{border:1.5px solid #cbd2dc;border-radius:10px;padding:11px;margin:0 14px 8px;color:#9ca3af;font-size:14px}
.game{min-height:100%;background:linear-gradient(180deg,#0c4a6e,#1e1b4b);color:#fff;padding:18px;text-align:center}
.game .chr{font-size:80px;margin:14px 0}
.game .st{display:flex;justify-content:center;gap:10px;margin:10px 0}
.game .st div{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:13px}
.game .st b{display:block;font-size:18px}
.game.hacked{background:linear-gradient(180deg,#450a0a,#000)}
/* quiz / final */
.qz .qn{font-size:12px;font-weight:800;color:#7c3aed}
.qz .qp{font-size:17px;font-weight:800;line-height:1.6;margin:6px 0 14px}
.qz .op{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:12px;font-size:14px;line-height:1.5;margin-bottom:8px;color:#1f2430}
.qz .op.ok{border-color:#2b8a3e;background:#ecfdf3}
.qz .op.ng{border-color:#e03131;background:#fef2f2}
.qz .fb{background:#fff;border-radius:12px;padding:12px;font-size:14px;line-height:1.7;margin:6px 0 12px;animation:pop .25s}
.bar{height:6px;background:#e5e7eb;border-radius:99px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#7c3aed}
.fin{flex:1;background:linear-gradient(160deg,#1e3a8a,#7c3aed);color:#fff;padding:56px 22px 20px;overflow-y:auto;text-align:center}
.fin h1{font-size:26px;margin:8px 0 16px}
.fin .sc{background:#fff;color:#1f2430;border-radius:16px;padding:14px;text-align:left;font-size:14px;margin-bottom:12px}
.fin .sc div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
.fin .sc div:last-child{border:none}
.fin .type{background:rgba(255,255,255,.15);border-radius:16px;padding:14px;margin-bottom:12px;line-height:1.7;font-size:14px}
.fin .type b{display:block;font-size:20px;margin-bottom:4px}
.fin .prom{background:#fff;color:#1f2430;border-radius:16px;padding:14px;text-align:left;font-size:14px;line-height:1.8;margin-bottom:14px}
.fin .btn{background:#fff;color:#1e3a8a}
.app .ic{position:relative}
.app .ic .badge{top:-7px;right:-7px}
.photos.g2{grid-template-columns:1fr 1fr}
.capopt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:6px;color:#1f2430}
.capopt.on{border-color:#ec4899;background:#fdf2f8}
.sec-t{font-weight:800;margin:14px 0 8px;font-size:15px}
.news-h{background:#111827;color:#fff;padding:12px 14px;font-size:12px;letter-spacing:.1em}
.news h1{font-size:20px;line-height:1.5;padding:14px 14px 6px}
.news .meta{font-size:11px;color:#6b7280;padding:0 14px 10px}
.news p{font-size:14px;line-height:1.85;padding:0 14px;margin-bottom:12px}
.news .real{margin:4px 14px 16px;background:#eff6ff;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.7;color:#1e3a8a}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin-bottom:12px}
.flow .fb2{background:#fff;border-radius:12px;padding:11px 12px;font-size:14px;line-height:1.6;box-shadow:0 1px 3px rgba(0,0,0,.08);animation:pop .4s both}
.flow .fb2 b{display:block;font-size:12px;color:#7c3aed}
.flow .ar{text-align:center;font-size:20px;color:#9ca3af;line-height:1.4}
.pwtab{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:10px}
.pwtab td{padding:8px 10px;border-bottom:1px solid #eee}
.pwtab .bad{color:#b91c1c;font-weight:800;font-family:monospace}
.sc2{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:14px;line-height:1.6}
.sc2.done{border:2px solid #22c55e}
.sc2.lock{opacity:.45;pointer-events:none}
.sc2 h4{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between}
.pwopt{display:block;width:100%;text-align:left;background:#f9fafb;border:2px solid #e5e7eb;border-radius:10px;padding:9px 10px;margin-bottom:6px;font-size:13px;color:#1f2430}
.pwopt code{font-size:15px;font-weight:800}
.fbk{font-size:13px;font-weight:700;margin-top:4px}.fbk.ng{color:#b91c1c}.fbk.ok{color:#15803d}
.mt{display:inline-block;background:#fee2e2;color:#991b1b;font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px}
.fin{position:relative}
#fx{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:20}
.flash{position:absolute;inset:0;background:#fff;z-index:21;pointer-events:none;animation:flash2 1.2s forwards}
@keyframes flash2{0%{opacity:1}100%{opacity:0}}
.trophy-wrap{position:relative;height:150px;display:flex;align-items:center;justify-content:center;margin:4px 0 2px}
.rays{position:absolute;width:320px;height:320px;left:50%;top:50%;margin:-160px 0 0 -160px;background:repeating-conic-gradient(rgba(253,224,71,.4) 0 10deg,transparent 10deg 20deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 15%,transparent 70%);mask:radial-gradient(circle,#000 15%,transparent 70%);animation:spin 12s linear infinite,fadein 1s both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.trophy{position:relative;font-size:96px;animation:tdrop .9s cubic-bezier(.3,1.6,.5,1) .2s both,tglow 2s 1.2s ease-in-out infinite alternate}
@keyframes tdrop{from{transform:translateY(-220px) scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes tglow{from{filter:drop-shadow(0 8px 16px rgba(253,224,71,.5))}to{filter:drop-shadow(0 8px 34px rgba(253,224,71,1))}}
.clear-t{font-size:48px!important;font-weight:900;letter-spacing:.08em;margin:0!important;background:linear-gradient(90deg,#fde047,#fff,#f9a8d4,#fde047);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop2 .7s cubic-bezier(.3,1.8,.5,1) .9s both,shine 3s linear 1.6s infinite}
@keyframes pop2{from{transform:scale(3);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{to{background-position:300% 0}}
.clear-s{font-size:14px;opacity:.9;margin-bottom:14px;animation:fadein .6s 1.4s both}
.fin .sc .row2{animation:slidein .5s both}
@keyframes slidein{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.star{display:inline-block;animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starpop{from{transform:scale(3) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.late{animation:rise .7s both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.cert{background:#fffdf5;color:#1f2430;border:4px double #b45309;border-radius:10px;padding:14px;margin-bottom:12px;font-size:13px;line-height:1.7;position:relative}
.cert b{display:block;font-size:20px;color:#92400e;letter-spacing:.3em;margin-bottom:4px}
.cert .seal{position:absolute;right:10px;bottom:8px;width:54px;height:54px;border-radius:50%;border:3px solid #dc2626;color:#dc2626;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);line-height:1.2}
.btn.again{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6);margin-top:10px}
.hack{position:absolute;inset:0;z-index:46;background:#000;color:#22c55e;font-family:"Courier New",monospace;overflow:hidden;display:flex;flex-direction:column}
.hack .hh{position:relative;z-index:2;background:#b91c1c;color:#fff;font-weight:900;padding:44px 12px 8px;font-family:sans-serif;font-size:15px;animation:wflash .35s infinite alternate}
.hack .tl{position:relative;z-index:2;flex:1;padding:10px 12px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-all;overflow:hidden;text-shadow:0 0 6px rgba(34,197,94,.7)}
.hack .tl .r{color:#f87171;font-weight:700;text-shadow:0 0 6px rgba(248,113,113,.8)}
.hack .tl .y{color:#fde047}
.hack .hex{position:absolute;inset:0;opacity:.13;font-size:10px;color:#22c55e;pointer-events:none;word-break:break-all;line-height:1.15}
.hack .big,.storm .big{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);border:5px solid #ef4444;color:#ef4444;font-size:30px;font-weight:900;padding:12px 18px;background:rgba(0,0,0,.88);font-family:sans-serif;white-space:nowrap;animation:slam .35s cubic-bezier(.3,1.8,.5,1) both;text-align:center;box-shadow:0 0 30px rgba(239,68,68,.7)}
.hack .big small,.storm .big small{display:block;font-size:12px;color:#fca5a5;margin-top:4px;white-space:normal;width:250px}
@keyframes slam{from{transform:translate(-50%,-50%) scale(4) rotate(-8deg);opacity:0}to{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1}}
.storm{position:absolute;inset:0;z-index:46;overflow:hidden;background:rgba(0,0,0,.25);transition:background .4s}
.pwin{position:absolute;width:215px;background:#f3f4f6;border:1px solid #6b7280;box-shadow:5px 5px 0 rgba(0,0,0,.45);font-size:12px;animation:pop .12s}
.pwin .pt{background:linear-gradient(90deg,#b91c1c,#ef4444);color:#fff;font-weight:800;padding:3px 6px;display:flex;justify-content:space-between}
.pwin .pb{padding:8px;color:#111;line-height:1.45}
.scan{position:absolute;inset:0;z-index:46;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:sans-serif}
.scan .sp{position:relative;width:270px;border:2px solid #ef4444;box-shadow:0 0 24px rgba(239,68,68,.6)}
.scan .line{position:absolute;left:0;right:0;height:3px;background:#ef4444;box-shadow:0 0 14px 3px #ef4444;animation:scanl 1.1s linear infinite;z-index:3}
@keyframes scanl{from{top:0}to{top:100%}}
.scan .tag{position:absolute;left:4%;z-index:4;background:rgba(220,38,38,.92);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:4px;animation:slam2 .3s both;max-width:92%}
@keyframes slam2{from{transform:scale(2.5);opacity:0}to{transform:none;opacity:1}}
.scan .st{margin-top:16px;font-size:15px;font-weight:800;color:#fca5a5;letter-spacing:.1em}
.scan .st.done{font-size:24px;color:#ef4444;animation:slam2 .35s both}
.scan .pct{font-family:monospace;font-size:13px;color:#fca5a5;margin-top:6px}
.money{position:absolute;inset:0;z-index:46;background:radial-gradient(circle,#7f1d1d,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
.money .yen{font-size:60px;font-weight:900;color:#fca5a5;animation:slam2 .4s both;text-shadow:0 0 20px rgba(239,68,68,.8)}
.money p{font-size:14px;line-height:1.8;margin-top:10px;animation:fadein .5s 1.2s both}
.phone.suck{animation:suck .95s cubic-bezier(.55,0,.85,.35) forwards;z-index:10}
@keyframes suck{0%{transform:scale(1)}18%{transform:scale(.93) rotate(-2deg)}100%{transform:scale(var(--s)) rotate(4deg);filter:blur(3px) brightness(1.7)}}
body.sucking{background:#000;transition:background .7s}
.warp{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-conic-gradient(from 0deg,rgba(124,58,237,.0) 0 6deg,rgba(167,139,250,.35) 6deg 7deg);animation:warp .95s ease-in forwards}
@keyframes warp{from{opacity:0;transform:scale(.4) rotate(0)}to{opacity:1;transform:scale(2.2) rotate(40deg)}}
#screen.arrive{animation:arrive .7s ease-out}
@keyframes arrive{from{opacity:0;filter:blur(10px) brightness(2)}to{opacity:1;filter:none}}
body.full{background:#000}
body.full .phone{width:100vw;height:100vh;padding:0;border-radius:0;box-shadow:none;background:#000}
body.full .screen{position:absolute;left:0;top:0;border-radius:0;transform-origin:0 0}
body.full .body,body.full .chips,body.full .choice,body.full .guide,body.full .inputbar,body.full .fine{padding-left:max(14px,calc((100% - 720px)/2));padding-right:max(14px,calc((100% - 720px)/2))}
body.full .home{padding-left:max(20px,calc((100% - 560px)/2));padding-right:max(20px,calc((100% - 560px)/2))}
body.full .title,body.full .intro,body.full .ds,body.full .fin{padding-left:max(22px,calc((100% - 620px)/2));padding-right:max(22px,calc((100% - 620px)/2))}
body.full .ah{padding-left:max(12px,calc((100% - 760px)/2))}
body.full .notif{left:50%;right:auto;width:min(480px,calc(100% - 20px));transform:translate(-50%,-140%)}
body.full .notif.show{transform:translate(-50%,0)}
body.full .modal .box{max-width:480px}
.title,.ds{overflow-y:auto}
#fsb{display:none;position:absolute;top:5px;right:64px;z-index:60;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;font-size:11px;padding:3px 8px;font-weight:700}
body.full #fsb{display:block}
body.full .photos.g2,body.full .post,body.full .map,body.full .scan .sp{max-width:440px;margin-left:auto;margin-right:auto}
body.full .photos.g2{margin-bottom:12px}
.shot{background:#ecfdf5;color:#111;border:1px solid #a7f3d0;border-radius:8px;padding:7px 9px;font-size:11.5px;line-height:1.6;white-space:normal;min-width:200px}
.shot.doc{background:#fff;border-color:#d1d5db}
.shot-h{font-weight:800;color:#047857;margin-bottom:3px}.shot.doc .shot-h{color:#374151}
.shot-f{color:#6b7280;font-size:10px;margin-top:3px}
.msg.me .bub .shot{color:#111}
</style>

    '<div class="prom late" style="animation-delay:6.5s"><b>📌 これからの4つの約束</b><br>① AIの答えは、自分で確かめてから使う<br>② AIにもSNSにも、自分や友だちの個人情報を入れない<br>③ パスワードは使い回さず、2段階認証をオンにする<br>④ あやしいと思ったら、立ち止まって大人に相談する</div>'+
    '<div class="late" style="animation-delay:7s"><button class="btn" onclick="stopFx();R={d1:null,d2:null,d3:null,d4:null,quiz:null};S={screen:\'title\',day:0,badge:{}};render()">タイトルにもどる</button><button class="btn again" onclick="celebrate(true)">🎉 もう一度お祝いする</button></div>'+
    '<div class="credit" style="margin-top:16px">© Irie Kanji</div></div>'};
var fxRAF=null,fxT=[];
function stopFx(){if(fxRAF)cancelAnimationFrame(fxRAF);fxRAF=null;fxT.forEach(clearTimeout);fxT=[]}
function fanfare(){
  [[523,0,.12],[523,.13,.12],[523,.26,.12],[659,.4,.35],[523,.8,.15],[659,.97,.15],[784,1.14,.7],[1047,1.14,.7]].forEach(function(x){tone(x[0],x[1],x[2]+.1,'square',.07);tone(x[0]/2,x[1],x[2]+.1,'triangle',.08)});
  [1047,1319,1568,2093].forEach(function(f,i){tone(f,1.9+i*.07,.5,'sine',.05)})}
function celebrate(again){
  stopFx();var cv=$('#fx');if(!cv)return;var box=cv.parentNode;
  if(again){var f=document.createElement('div');f.className='flash';box.appendChild(f);setTimeout(function(){f.remove()},1300)}
  fanfare();
  if(!again){
    document.querySelectorAll('.fin .star').forEach(function(el){var dl=parseFloat(el.style.animationDelay)*1000;fxT.push(setTimeout(function(){tone(el.textContent==='⭐'?1568:700,0,.18,'triangle',.08)},dl))});
    fxT.push(setTimeout(function(){var n=0,tgt=R.quiz||0;var iv=setInterval(function(){var e=$('#qcount');if(!e){clearInterval(iv);return}if(n>=tgt){clearInterval(iv);tone(1319,0,.3,'triangle',.08);return}n++;e.textContent=n;tone(900+n*60,0,.06,'square',.04)},120)},4500));
  }
  var ctx=cv.getContext('2d'),W,H,P=[],t0=performance.now(),dpr=window.devicePixelRatio||1;
  W=box.clientWidth;H=Math.max(box.scrollHeight,box.clientHeight);cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  var cols=['#fde047','#f472b6','#60a5fa','#34d399','#f87171','#c084fc','#fb923c','#ffffff'];
  var vh=box.clientHeight,top=box.scrollTop;
  function conf(x,y,n,spd){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=(Math.random()*.6+.4)*spd;P.push({k:'c',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*.6,r:Math.random()*360,vr:(Math.random()-.5)*14,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[i%cols.length]})}}
  function firework(x,y){var c=cols[Math.floor(Math.random()*7)];for(var i=0;i<60;i++){var a=i/60*Math.PI*2,v=2.5+Math.random()*2.5;P.push({k:'f',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:c,life:1})}tone(160+Math.random()*80,0,.25,'sawtooth',.03)}
  conf(W*.12,top+vh*.08,70,9);conf(W*.88,top+vh*.08,70,9);
  [600,1100,1600,2300,3000,3800,4600].forEach(function(ms){fxT.push(setTimeout(function(){firework(W*(.2+Math.random()*.6),top+vh*(.12+Math.random()*.3))},ms))});
  [1500,3200,5000].forEach(function(ms){fxT.push(setTimeout(function(){conf(W*.5,top+vh*.15,90,10)},ms))});
  function step(now){
    var el=now-t0;ctx.clearRect(0,0,W,H);
    if(el<9000&&Math.random()<.35)P.push({k:'c',x:Math.random()*W,y:box.scrollTop-10,vx:(Math.random()-.5)*1.5,vy:1.5+Math.random()*2,r:0,vr:(Math.random()-.5)*10,w:6+Math.random()*5,h:4+Math.random()*3,c:cols[Math.floor(Math.random()*8)]});
    for(var i=P.length-1;i>=0;i--){var p=P[i];
      if(p.k==='c'){p.vy+=.12;p.vx*=.99;p.vy=Math.min(p.vy,4.5);p.x+=p.vx+Math.sin(now/300+i)*.4;p.y+=p.vy;p.r+=p.vr;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r/40)));ctx.restore();
        if(p.y>H+20)P.splice(i,1)}
      else{p.vx*=.96;p.vy=p.vy*.96+.05;p.x+=p.vx;p.y+=p.vy;p.life-=.012;
        ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.4,0,7);ctx.fill();ctx.globalAlpha=1;
        if(p.life<=0)P.splice(i,1)}}
    if(el<14000||P.length)fxRAF=requestAnimationFrame(step);else fxRAF=null;
  }
  fxRAF=requestAnimationFrame(step);
}

render();

</script>
